<div class="space-y-6 animate-fade-in">

    <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">

            <button (click)="cancel()"
                class="p-2 text-slate-400 hover:text-slate-900 hover:bg-slate-100 rounded-xl transition-all">
                <i class="pi pi-arrow-left text-sm"></i>
            </button>

            <div>
                <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">Work Order</h1>
                <p class="text-sm text-slate-500 mt-0.5">Create a new work order</p>
            </div>
        </div>

        <button type="button" (click)="toggleLock()"
            class="flex items-center gap-2 px-3 py-1 bg-gray-100 rounded hover:bg-gray-200 transition-all border border-gray-300">
            <i class="pi" [ngClass]="isLocked ? 'pi-lock' : 'pi-lock-open'"></i>
        </button>
    </div>


    <div class="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden">
        <div class="p-6 sm:p-8">
            <form [formGroup]="workOrderForm" class="space-y-6">


                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">

                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-600 uppercase tracking-wider">Style</label>
                        <p-select appendTo="body" formControlName="style_Id" [options]="allStyle()" filter="true"
                            optionLabel="viewValue" optionValue="value" [emptyFilterMessage]="'No Style Found'"
                            placeholder="Select Style" class="w-full" styleClass="w-full"></p-select>
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-600 uppercase tracking-wider">Customer</label>

                        <p-select appendTo="body" formControlName="customer" [options]="allCustomers()" filter="true"
                            optionLabel="viewValue" optionValue="value" [emptyFilterMessage]="'No Customer Found'"
                            placeholder="Select Customer" class="w-full">
                        </p-select>
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-600 uppercase tracking-wider">Order Receiving Date
                            <br></label>
                        <p-datepicker appendTo="body" formControlName="rec_Date" [showIcon]="true" dateFormat="dd/mm/yy"
                            class="w-full" placeholder="Choose Order Receiving Date" [showTime]="false"></p-datepicker>
                    </div>


                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-600 uppercase tracking-wider">Wastages</label>

                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">



                            <p-floatlabel variant="on">
                                <label class="text-xs">Knitting</label>
                                <input pInputText pSize="small" type="number" formControlName="knitting_Waste"
                                    class="w-full" min="1" max="100" (input)="onWasteInput('knitting_Waste', $event)">
                            </p-floatlabel>


                            <p-floatlabel variant="on">
                                <label class="text-xs">Dyeing</label>
                                <input pInputText pSize="small" type="number" formControlName="dyeing_Waste"
                                    class="w-full" min="1" max="100" (input)="onWasteInput('dyeing_Waste', $event)">
                            </p-floatlabel>

                            <p-floatlabel variant="on">
                                <label class="text-xs">Cutting</label>
                                <input pInputText pSize="small" type="number" formControlName="cutting_Waste"
                                    class="w-full" min="1" max="100" (input)="onWasteInput('cutting_Waste', $event)">
                            </p-floatlabel>

                            <p-floatlabel variant="on">
                                <label class="text-xs">Printing</label>
                                <input pInputText pSize="small" type="number" formControlName="printing_Waste"
                                    class="w-full" min="1" max="100" (input)="onWasteInput('printing_Waste', $event)">
                            </p-floatlabel>

                            <p-floatlabel variant="on">
                                <label class="text-xs">Embroidery</label>
                                <input pInputText pSize="small" type="number" formControlName="embroidery_Waste"
                                    class="w-full" min="1" max="100" (input)="onWasteInput('embroidery_Waste', $event)">
                            </p-floatlabel>

                            <p-floatlabel variant="on">
                                <label class="text-xs">GWP/Laundry</label>
                                <input pInputText pSize="small" type="number" formControlName="gWP_Laundry_Waste"
                                    class="w-full" min="1" max="100"
                                    (input)="onWasteInput('gWP_Laundry_Waste', $event)">
                            </p-floatlabel>

                            <p-floatlabel variant="on">
                                <label class="text-xs">Sewing</label>
                                <input pInputText pSize="small" type="number" formControlName="sewing_Waste"
                                    class="w-full" min="1" max="100" (input)="onWasteInput('sewing_Waste', $event)">
                            </p-floatlabel>

                        </div>

                    </div>


                </div>

                <div formArrayName="colorsDetailList" class="space-y-4">
                    <div *ngFor="let colorCtrl of colorsArray.controls; let cIndex = index" [formGroupName]="cIndex"
                        class="space-y-4 pb-4">

                        <hr class="border-t border-slate-200 my-4">

                        <div class="flex items-end gap-2 pb-1">

                            <button *ngIf="colorsArray.length > 1" type="button" (click)="removeColor(cIndex)"
                                [disabled]="isLocked"
                                class="w-9 h-9 flex items-center justify-center bg-red-50 text-red-500 rounded-full hover:bg-red-100 transition-all">
                                <i class="pi pi-minus text-xs"></i>
                            </button>

                            <button *ngIf="cIndex === colorsArray.length - 1 && isMainFieldsValid(cIndex)" type="button"
                                (click)="addColor()" [disabled]="isLocked"
                                class="w-9 h-9 flex items-center justify-center bg-indigo-50 text-indigo-600 rounded-full hover:bg-indigo-100 transition-all">
                                <i class="pi pi-plus text-xs"></i>
                            </button>

                        </div>



                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">

                            <div class="space-y-1.5">
                                <label class="text-xs font-bold text-slate-600 uppercase tracking-wider">Purchase
                                    Order</label>
                                <input pInputText type="number" formControlName="customer_pO"
                                    placeholder="Enter Purchase Order" class="w-full" />
                            </div>


                            <div class="space-y-1.5">
                                <label class="text-xs font-bold text-slate-600 uppercase tracking-wider">Color</label>
                                <p-select appendTo="body" formControlName="color_Id" [options]="allColors()"
                                    filter="true" optionLabel="viewValue" optionValue="value"
                                    [options]="getAvailableColors(cIndex)" [emptyFilterMessage]="'No Color Found'"
                                    placeholder="Select Color" class="w-full" [virtualScroll]="true"
                                    [virtualScrollItemSize]="30">
                                </p-select>
                            </div>


                            <div class="space-y-1.5">
                                <label class="text-xs font-bold text-slate-600 uppercase tracking-wider">Shipment Date
                                    <br></label>
                                <p-datepicker appendTo="body" formControlName="ship_Date" [showIcon]="true"
                                    class="w-full" dateFormat="dd/mm/yy" placeholder="Choose Shipment Date"
                                    [showTime]="false" [minDate]="minDate"></p-datepicker>
                            </div>

                        </div>



                        <div *ngIf="colorCtrl.get('color_Id')?.value">


                            <div formArrayName="sizeDetailList" class="col-span-9 space-y-5">

                                <div *ngFor="let sizeCtrl of getSizesArray(getColorGroup(cIndex)).controls; let si = index"
                                    [formGroupName]="si"
                                    class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-10 gap-5 items-end">

                                    <div class="space-y-1.5">
                                        <label
                                            class="text-xs font-bold text-slate-600 uppercase tracking-wider">Size</label>
                                        <p-select appendTo="body" formControlName="size_Id"
                                            [options]="getAvailableSizes(cIndex, si)" optionLabel="viewValue"
                                            optionValue="value" placeholder="Select Size" filter="true" class="w-full">
                                        </p-select>
                                    </div>


                                    <div class="space-y-1.5">
                                        <label
                                            class="text-xs font-bold text-slate-600 uppercase tracking-wider">Pieces</label>
                                        <input pInputText type="number" formControlName="qty" placeholder="Enter Pieces"
                                            class="w-full" />
                                    </div>


                                    <div class="flex gap-2">
                                        <button *ngIf="getSizesArray(getColorGroup(cIndex)).length > 1" type="button"
                                            (click)="removeSize(getColorGroup(cIndex), si)" [disabled]="isLocked"
                                            class="w-8 h-8 flex items-center justify-center bg-red-50 text-red-500 rounded-full hover:bg-red-100 transition-all">
                                            <i class="pi pi-minus text-xs"></i>
                                        </button>


                                        <button *ngIf="si === getSizesArray(getColorGroup(cIndex)).length - 1"
                                            type="button" (click)="addSize(getColorGroup(cIndex))" [disabled]="isLocked"
                                            class="w-8 h-8 flex items-center justify-center bg-indigo-50 text-indigo-600 rounded-full hover:bg-indigo-100 transition-all">
                                            <i class="pi pi-plus text-xs"></i>
                                        </button>
                                    </div>


                                    <ng-container formArrayName="wastagesList">
                                        <ng-container
                                            *ngFor="let wasteCtrl of getWastagesArray(sizeCtrl).controls; let wi = index">
                                            <div *ngIf="wasteCtrl.get('wastage')?.value > 0" [formGroupName]="wi"
                                                class="space-y-1.5">
                                                <label class="text-[10px] font-bold text-slate-600 uppercase">
                                                    {{ getWasteLabel(wasteCtrl.get('wastage_Type')?.value) }}
                                                </label>
                                                <input pInputText type="number" formControlName="wastage"
                                                    class="w-full" />
                                            </div>
                                        </ng-container>
                                    </ng-container>


                                </div>

                            </div>

                        </div>

                    </div>
                </div>

            </form>
        </div>



        <div class="px-6 sm:px-8 py-5 border-t border-slate-100 bg-slate-50/50 flex items-center justify-between">
            <button type="button" (click)="cancel()"
                class="px-5 py-2.5 text-sm font-bold text-slate-500 hover:text-slate-900 hover:bg-slate-100 rounded-xl transition-all">
                Cancel
            </button>

            <button type="submit" (click)="AddUpdateWorkOrder()"
                class="px-6 py-2.5 text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-lg shadow-indigo-200 hover:shadow-indigo-300 transition-all active:scale-95">
                <i class="pi pi-check text-xs mr-2"></i>Save
            </button>
        </div>


    </div>
</div>
