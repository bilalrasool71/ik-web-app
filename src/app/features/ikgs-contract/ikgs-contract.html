<div class="space-y-6 sm:space-y-8 animate-fade-in">
  <!-- Header -->
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">IKGS Contracts</h1>
      <p class="text-sm text-slate-500 mt-1">Manage knitting, dyeing and cutting contracts</p>
    </div>

    <button
      routerLink="/ikgs/contract/new"
      class="inline-flex items-center gap-2 px-5 py-2.5 bg-indigo-600 text-white text-sm font-bold rounded-xl hover:bg-indigo-700 hover:shadow-lg hover:shadow-indigo-200 transition-all active:scale-95"
    >
      <i class="pi pi-plus text-xs"></i>
      <span>New Contract</span>
    </button>
  </div>

  <!-- Table -->
  <div class="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <!-- Table Head -->
        <thead class="bg-slate-50/50 border-b border-slate-100">
          <tr>
            <th
              class="px-4 py-4 font-bold text-[10px] text-slate-400 uppercase tracking-widest whitespace-nowrap"
            >
              Work Order
            </th>

            <th
              class="px-4 py-4 font-bold text-[10px] text-slate-400 uppercase tracking-widest whitespace-nowrap"
            >
              Yarn Qty
            </th>

            <th
              class="px-4 py-4 font-bold text-[10px] text-slate-400 uppercase tracking-widest whitespace-nowrap"
            >
              Knitting
            </th>

            <th
              class="px-4 py-4 font-bold text-[10px] text-slate-400 uppercase tracking-widest whitespace-nowrap"
            >
              Dyeing
            </th>

            <th
              class="px-4 py-4 font-bold text-[10px] text-slate-400 uppercase tracking-widest whitespace-nowrap"
            >
              Cutting
            </th>

            <th
              class="px-4 py-4 font-bold text-[10px] text-slate-400 uppercase tracking-widest whitespace-nowrap"
            >
              Stages
            </th>

            <th
              class="px-4 py-4 font-bold text-[10px] text-slate-400 uppercase tracking-widest text-right whitespace-nowrap"
            >
              Actions
            </th>
          </tr>
        </thead>

        <!-- Table Body -->
        <tbody class="divide-y divide-slate-50">
          <!-- Example Row -->
          <tr class="hover:bg-slate-50/50 transition-colors">
            <td class="px-4 py-3 text-sm font-semibold text-slate-700">WO-10231</td>

            <td class="px-4 py-3 text-sm text-slate-600">1200 KG</td>

            <td class="px-4 py-3 text-sm text-slate-600">2 Parties</td>

            <td class="px-4 py-3 text-sm text-slate-600">3 Colors</td>

            <td class="px-4 py-3 text-sm text-slate-600">5 Sizes</td>

            <td class="px-4 py-3">
              <div class="flex gap-2 flex-wrap">
                <span
                  class="px-2.5 py-1 bg-blue-100 text-blue-700 rounded-full text-[10px] font-bold uppercase tracking-widest"
                >
                  Yarn
                </span>

                <span
                  class="px-2.5 py-1 bg-indigo-100 text-indigo-700 rounded-full text-[10px] font-bold uppercase tracking-widest"
                >
                  Knitting
                </span>

                <span
                  class="px-2.5 py-1 bg-purple-100 text-purple-700 rounded-full text-[10px] font-bold uppercase tracking-widest"
                >
                  Dyeing
                </span>

                <span
                  class="px-2.5 py-1 bg-green-100 text-green-700 rounded-full text-[10px] font-bold uppercase tracking-widest"
                >
                  Cutting
                </span>
              </div>
            </td>

            <td class="px-4 py-3 text-right whitespace-nowrap">
              <button
                class="p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-all"
              >
                <i class="pi pi-pencil text-xs"></i>
              </button>

              <button
                class="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-all ml-1"
              >
                <i class="pi pi-trash text-xs"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
