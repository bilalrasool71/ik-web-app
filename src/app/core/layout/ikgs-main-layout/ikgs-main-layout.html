<div class="flex h-screen bg-slate-50 overflow-hidden font-sans selection:bg-indigo-500/10 relative">

    <!-- Mobile Sidebar Backdrop -->
    @if(isMobileMenuOpen()) {
    <div (click)="closeMobileMenu()"
        class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 lg:hidden transition-opacity animate-in fade-in duration-300">
    </div>
    }

    <!-- Modular Sidebar -->
    <app-ikgs-sidebar [isVisible]="isSidebarVisible()" [isMobileOpen]="isMobileMenuOpen()"
        [isMobileOnly]="isMobileOnly()" (closeMobileMenu)="closeMobileMenu()" />

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0 h-screen relative transition-all duration-300 ease-in-out"
        [class.lg:pl-72]="isSidebarVisible()">

        <!-- Modular Header -->
        <app-ikgs-header (sidebarToggle)="toggleSidebar()" (mobileMenuToggle)="toggleMobileMenu()" />

        <!-- View Outlet -->
        <div class="flex-1 overflow-y-auto p-4 sm:p-8 relative scroll-smooth bg-slate-50/50">
            <router-outlet />
        </div>

        <!-- Modular Footer -->
        <app-ikgs-footer />
    </main>
</div>
